<!doctype html>
<!--
  HAP — İş Girişi formu.
  Bu dosyanın TAMAMI, HAP sayfasındaki "Embed HTML" (HTML iframe) öğesine
  yapıştırılır. Öğenin ID'si: isGirisiFormu
  Veri bu formda TUTULMAZ: form, sayfa koduna (HAP.drdx8.js) mesaj gönderir,
  sayfa kodu da yalnızca yöneticilere açık backend fonksiyonlarını çağırır.
-->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Girişi</title>
<style>
  :root {
    --zemin: #ffffff; --metin: #1d1f23; --soluk: #5d636e; --cizgi: #d9dce1;
    --vurgu: #1f4e79; --vurgu-acik: #e8eef5; --hata: #a4262c; --hata-zemin: #fbeaea;
    --tamam: #1e6b3a; --tamam-zemin: #e7f4ec; --uyari-zemin: #fff6e0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--zemin); color: var(--metin);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form#form { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .alt { color: var(--soluk); margin: 0 0 16px; font-size: 14px; }
  fieldset { border: 1px solid var(--cizgi); border-radius: 8px; padding: 12px 14px 4px; margin: 0 0 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  .izgara { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .tam { grid-column: 1 / -1; }
  @media (max-width: 560px) { .izgara { grid-template-columns: 1fr; } }
  label { display: block; margin-bottom: 10px; font-size: 14px; color: var(--soluk); }
  label > span.ad, span.ad { display: block; margin-bottom: 3px; color: var(--metin); font-weight: 500; font-size: 14px; }
  .zorunlu::after { content: " *"; color: var(--hata); }
  input[type=text], input[type=email], input[type=tel], input[type=date], input[type=search], select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--cizgi); border-radius: 6px;
    font: inherit; color: var(--metin); background: #fff; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--vurgu); outline-offset: 0; border-color: var(--vurgu); }
  .radyo { display: flex; gap: 18px; padding: 6px 0 10px; color: var(--metin); }
  .radyo label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--metin); }
  .ipucu { font-size: 13px; color: var(--soluk); margin: -4px 0 10px; }
  .butonlar { display: flex; gap: 10px; align-items: center; }
  button { font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 6px; border: 1px solid var(--vurgu);
           background: var(--vurgu); color: #fff; cursor: pointer; }
  button.ikincil { background: #fff; color: var(--vurgu); }
  button.kucuk { padding: 4px 10px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: wait; }
  .mesaj { margin: 14px 0 0; padding: 10px 12px; border-radius: 6px; display: none; white-space: pre-line; }
  .mesaj.hata { display: block; background: var(--hata-zemin); color: var(--hata); }
  .mesaj.tamam { display: block; background: var(--tamam-zemin); color: var(--tamam); }
  .mesaj.bilgi { display: block; background: var(--vurgu-acik); color: var(--vurgu); }
  .mesaj.uyari { display: block; background: var(--uyari-zemin); color: #6b4e00; }
  [hidden] { display: none !important; }

  /* Müşteri arama kutusu */
  .arama { position: relative; margin-bottom: 10px; }
  .oneriler { position: absolute; left: 0; right: 0; top: 100%; z-index: 5; margin: 2px 0 0; padding: 4px 0;
              list-style: none; background: #fff; border: 1px solid var(--cizgi); border-radius: 6px;
              box-shadow: 0 6px 18px rgba(0,0,0,.08); max-height: 260px; overflow-y: auto; }
  .oneriler li { padding: 8px 12px; cursor: pointer; }
  .oneriler li .kucuk-metin { color: var(--soluk); font-size: 13px; }
  .oneriler li.aktif, .oneriler li:hover { background: var(--vurgu-acik); }
  .oneriler li.yeni { color: var(--vurgu); font-weight: 600; border-top: 1px solid var(--cizgi); }
  .oneriler li.bos { color: var(--soluk); cursor: default; background: none; }
  .secili { display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 8px 12px; border: 1px solid var(--vurgu); border-radius: 6px; background: var(--vurgu-acik); margin-bottom: 10px; }
  .secili .ad-buyuk { font-weight: 600; }
  .secili .kucuk-metin { color: var(--soluk); font-size: 13px; }

  /* Yeni müşteri penceresi */
  .perde { position: fixed; inset: 0; background: rgba(20,24,30,.45); display: flex; align-items: flex-start;
           justify-content: center; padding: 40px 16px; z-index: 10; overflow-y: auto; }
  .pencere { background: #fff; border-radius: 10px; width: 100%; max-width: 560px; padding: 18px 18px 14px;
             box-shadow: 0 12px 40px rgba(0,0,0,.25); }
</style>
</head>
<body>
<form id="form" novalidate>
  <h1>İş Girişi</h1>
  <p class="alt">İşi HAP'e kaydeder. Değerlendirme ve yönlendirme sonraki aşamalarda yapılır.</p>

  <fieldset>
    <legend>İş türü</legend>
    <label><span class="ad zorunlu">Kategori</span>
      <select id="kategori" required></select>
    </label>
  </fieldset>

  <div id="isAlanlari">
    <fieldset id="musteriAlani">
      <legend>Müşteri</legend>
      <span class="ad zorunlu">İşi sipariş eden müşteri</span>
      <div class="arama" id="aramaKutusu">
        <input type="search" id="musteriAra" autocomplete="off" placeholder="Ad, kişi, telefon veya e-posta yazın…"
               role="combobox" aria-expanded="false" aria-controls="oneriler" aria-autocomplete="list">
        <ul class="oneriler" id="oneriler" role="listbox" hidden></ul>
      </div>
      <div class="secili" id="seciliMusteri" hidden>
        <div><div class="ad-buyuk" id="seciliAd"></div><div class="kucuk-metin" id="seciliDetay"></div></div>
        <button type="button" class="ikincil kucuk" id="musteriDegistir">Değiştir</button>
      </div>
      <p class="ipucu" id="musteriIpucu">Kayıtlı değilse listenin altındaki “Yeni müşteri ekle”yi seçin.</p>
    </fieldset>

    <fieldset>
      <legend id="isBaslik">İş</legend>
      <label id="modulAlani" hidden><span class="ad zorunlu">Modül</span>
        <select id="modul"></select>
      </label>
      <label><span class="ad zorunlu">Açıklama</span>
        <textarea id="aciklama" maxlength="5000" placeholder="İş ne? Tek cümleyle başlayın."></textarea>
      </label>
      <label id="kapsamAlani"><span class="ad">Kapsam</span>
        <textarea id="kapsam" maxlength="5000" placeholder="Neler dahil, neler değil?"></textarea>
      </label>
      <label><span class="ad">Notlar</span>
        <textarea id="notlar" maxlength="5000"></textarea>
      </label>
      <div class="izgara">
        <label id="kaynakAlani"><span class="ad zorunlu">Kaynak</span>
          <select id="kaynak"></select>
        </label>
        <label><span class="ad" id="terminEtiket">Bitiş tarihi</span>
          <input type="date" id="termin">
        </label>
      </div>
      <div id="aciliyetAlani">
        <span class="ad">Aciliyet</span>
        <div class="radyo" id="aciliyet"></div>
      </div>
    </fieldset>
  </div>

  <div class="butonlar">
    <button type="submit" id="kaydet" disabled>İşi kaydet</button>
    <button type="button" class="ikincil" id="vazgec">Vazgeç</button>
  </div>
  <div id="mesaj" class="mesaj" role="status" aria-live="polite"></div>
</form>

<!-- Yeni müşteri penceresi -->
<div class="perde" id="perde" hidden>
  <div class="pencere" role="dialog" aria-modal="true" aria-labelledby="pencereBaslik">
    <form id="musteriFormu" novalidate>
      <h2 id="pencereBaslik">Yeni müşteri</h2>
      <div class="izgara">
        <label class="tam"><span class="ad zorunlu">Ad / Unvan</span><input type="text" id="m_name" maxlength="300"></label>
        <label><span class="ad">İrtibat kişisi</span><input type="text" id="m_contactName" maxlength="300"></label>
        <label><span class="ad">Telefon</span><input type="tel" id="m_phone" maxlength="300"></label>
        <label><span class="ad">E-posta</span><input type="email" id="m_email" maxlength="300"></label>
        <label class="tam"><span class="ad">Adres</span><input type="text" id="m_address" maxlength="1000"></label>
      </div>
      <div class="butonlar">
        <button type="submit" id="musteriKaydet">Müşteriyi kaydet</button>
        <button type="button" class="ikincil" id="musteriVazgec">Vazgeç</button>
      </div>
      <div id="musteriMesaj" class="mesaj" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>

<script>
(function () {
  var MUSTERI_ALANLARI = ['name', 'contactName', 'email', 'phone', 'address'];
  var musteriler = [];
  var secili = null;          // seçili müşteri nesnesi
  var aktifIndex = -1;        // klavye ile vurgulanan öneri
  var bekliyor = false;
  var musteriBekliyor = false;
  var secenekGeldi = false;
  var $ = function (id) { return document.getElementById(id); };

  function gonder(mesaj) { window.parent.postMessage(mesaj, '*'); }
  function mesajGoster(id, tur, metin) { var m = $(id); m.className = 'mesaj ' + (tur || ''); m.textContent = metin || ''; }
  function kucult(s) { return String(s || '').toLocaleLowerCase('tr-TR').trim(); }

  function secenekDoldur(select, sozluk, bosEtiket) {
    var onceki = select.value;
    select.innerHTML = '';
    if (bosEtiket !== undefined) {
      var bos = document.createElement('option'); bos.value = ''; bos.textContent = bosEtiket; select.appendChild(bos);
    }
    Object.keys(sozluk).forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = sozluk[k]; select.appendChild(o);
    });
    if (onceki && sozluk[onceki] !== undefined) select.value = onceki;
  }

  function aciliyetDoldur(sozluk) {
    var kutu = $('aciliyet');
    var onceki = (kutu.querySelector('input:checked') || {}).value || 'normal';
    kutu.innerHTML = '';
    Object.keys(sozluk).forEach(function (k) {
      var l = document.createElement('label');
      var r = document.createElement('input'); r.type = 'radio'; r.name = 'aciliyet'; r.value = k; r.checked = (k === onceki);
      l.appendChild(r); l.appendChild(document.createTextNode(sozluk[k])); kutu.appendChild(l);
    });
  }

  // ---- Müşteri arama ----

  function detayMetni(m) {
    return [m.contactName, m.phone, m.email].filter(Boolean).join(' · ');
  }

  function eslesenler(sorgu) {
    var q = kucult(sorgu);
    if (!q) return musteriler.slice(0, 8);
    return musteriler.filter(function (m) {
      return [m.name, m.contactName, m.phone, m.email].some(function (v) { return kucult(v).indexOf(q) !== -1; });
    }).slice(0, 8);
  }

  function onerileriGoster() {
    var liste = $('oneriler');
    var sorgu = $('musteriAra').value.trim();
    var sonuc = eslesenler(sorgu);
    liste.innerHTML = '';
    aktifIndex = -1;

    if (!sonuc.length) {
      var bos = document.createElement('li'); bos.className = 'bos';
      bos.textContent = musteriler.length ? 'Eşleşen kayıtlı müşteri yok.' : 'Henüz kayıtlı müşteri yok.';
      liste.appendChild(bos);
    }
    sonuc.forEach(function (m) {
      var li = document.createElement('li'); li.setAttribute('role', 'option');
      var ad = document.createElement('div'); ad.textContent = m.name;
      var d = detayMetni(m);
      li.appendChild(ad);
      if (d) { var k = document.createElement('div'); k.className = 'kucuk-metin'; k.textContent = d; li.appendChild(k); }
      li.addEventListener('mousedown', function (e) { e.preventDefault(); musteriSec(m); });
      liste.appendChild(li);
    });
    var yeni = document.createElement('li'); yeni.className = 'yeni'; yeni.setAttribute('role', 'option');
    yeni.textContent = sorgu ? '+ Yeni müşteri ekle: “' + sorgu + '”' : '+ Yeni müşteri ekle';
    yeni.addEventListener('mousedown', function (e) { e.preventDefault(); pencereAc(sorgu); });
    liste.appendChild(yeni);

    liste.hidden = false;
    $('musteriAra').setAttribute('aria-expanded', 'true');
  }

  function onerileriKapat() {
    $('oneriler').hidden = true;
    $('musteriAra').setAttribute('aria-expanded', 'false');
  }

  function aktifiGuncelle(yon) {
    var ogeler = [].slice.call($('oneriler').querySelectorAll('li:not(.bos)'));
    if (!ogeler.length) return;
    aktifIndex = (aktifIndex + yon + ogeler.length) % ogeler.length;
    ogeler.forEach(function (li, i) { li.classList.toggle('aktif', i === aktifIndex); });
    ogeler[aktifIndex].scrollIntoView({ block: 'nearest' });
  }

  function musteriSec(m) {
    secili = m;
    $('seciliAd').textContent = m.name;
    $('seciliDetay').textContent = detayMetni(m);
    $('seciliMusteri').hidden = false;
    $('aramaKutusu').hidden = true;
    $('musteriIpucu').hidden = true;
    $('musteriAra').value = '';
    onerileriKapat();
  }

  function seciliyiKaldir() {
    secili = null;
    $('seciliMusteri').hidden = true;
    $('aramaKutusu').hidden = false;
    $('musteriIpucu').hidden = false;
    $('musteriAra').value = '';
  }

  $('musteriAra').addEventListener('input', onerileriGoster);
  $('musteriAra').addEventListener('focus', onerileriGoster);
  $('musteriAra').addEventListener('blur', function () { setTimeout(onerileriKapat, 120); });
  $('musteriAra').addEventListener('keydown', function (e) {
    if ($('oneriler').hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) onerileriGoster();
    if (e.key === 'ArrowDown') { e.preventDefault(); aktifiGuncelle(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); aktifiGuncelle(-1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      var ogeler = $('oneriler').querySelectorAll('li:not(.bos)');
      if (aktifIndex >= 0 && ogeler[aktifIndex]) ogeler[aktifIndex].dispatchEvent(new MouseEvent('mousedown'));
    } else if (e.key === 'Escape') { onerileriKapat(); }
  });
  $('musteriDegistir').addEventListener('click', function () { seciliyiKaldir(); $('musteriAra').focus(); });

  // ---- Yeni müşteri penceresi ----

  function pencereAc(ad) {
    onerileriKapat();
    MUSTERI_ALANLARI.forEach(function (a) { $('m_' + a).value = ''; });
    $('m_name').value = ad || '';
    mesajGoster('musteriMesaj', '', '');
    $('perde').hidden = false;
    $('m_name').focus();
  }
  function pencereKapat() { if (!musteriBekliyor) $('perde').hidden = true; }

  $('musteriVazgec').addEventListener('click', pencereKapat);
  $('perde').addEventListener('mousedown', function (e) { if (e.target === $('perde')) pencereKapat(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('perde').hidden) pencereKapat(); });

  $('musteriFormu').addEventListener('submit', function (e) {
    e.preventDefault();
    if (musteriBekliyor) return;
    var bilgiler = {};
    MUSTERI_ALANLARI.forEach(function (a) { bilgiler[a] = $('m_' + a).value.trim(); });
    if (!bilgiler.name) { mesajGoster('musteriMesaj', 'hata', 'Ad / Unvan zorunlu.'); return; }
    if (bilgiler.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(bilgiler.email)) {
      mesajGoster('musteriMesaj', 'hata', 'E-posta adresi geçersiz.'); return;
    }
    musteriBekliyor = true; $('musteriKaydet').disabled = true;
    mesajGoster('musteriMesaj', 'bilgi', 'Kaydediliyor…');
    gonder({ tip: 'musteriEkle', bilgiler: bilgiler });
  });

  // ---- İş formu ----

  // Kategoriye göre alanlar: A müşteri + kaynak; B modül; C sade hatırlatma.
  var KATEGORI_METNI = {
    A: { baslik: 'İş', aciklama: 'İş ne? Tek cümleyle başlayın.', tarih: 'Bitiş tarihi', buton: 'İşi kaydet' },
    B: { baslik: 'Pazarlama işi', aciklama: 'Ne üretilecek / yapılacak? ör. LinkedIn içerik serisi', tarih: 'Bitiş tarihi', buton: 'İşi kaydet' },
    C: { baslik: 'Rutin iş', aciklama: 'Ne yapılacak? ör. Kargo gönderilecek', tarih: 'Tarih', buton: 'Hatırlatmayı kaydet' }
  };
  function kategoriDegisti() {
    var k = $('kategori').value;
    var m = KATEGORI_METNI[k] || KATEGORI_METNI.A;
    $('isAlanlari').hidden = !k;
    $('musteriAlani').hidden = k !== 'A';
    $('kaynakAlani').hidden = k !== 'A';
    $('modulAlani').hidden = k !== 'B';
    $('kapsamAlani').hidden = k === 'C';
    $('aciliyetAlani').hidden = k === 'C';
    $('isBaslik').textContent = m.baslik;
    $('aciklama').placeholder = m.aciklama;
    $('terminEtiket').textContent = m.tarih;
    $('kaydet').textContent = m.buton;
  }

  function formuTemizle() {
    ['aciklama', 'kapsam', 'notlar', 'termin'].forEach(function (id) { $(id).value = ''; });
    $('kaynak').value = ''; $('modul').value = '';
    var n = document.querySelector('input[name=aciliyet][value=normal]'); if (n) n.checked = true;
    seciliyiKaldir();
  }

  function girdiTopla() {
    return {
      kategori: $('kategori').value,
      modul: $('modul').value,
      musteri: { id: secili ? secili.id : null },
      musteriBilgileri: {},
      aciklama: $('aciklama').value.trim(),
      kapsam: $('kapsam').value.trim(),
      notlar: $('notlar').value.trim(),
      termin: $('termin').value,
      aciliyet: (document.querySelector('input[name=aciliyet]:checked') || {}).value || 'normal',
      kaynak: $('kaynak').value
    };
  }

  function onKontrol(g) {
    if (!g.kategori) return 'Kategori seçin.';
    if (g.kategori === 'A' && !g.musteri.id) return 'Müşteri seçin. Kayıtlı değilse “Yeni müşteri ekle” ile kaydedin.';
    if (g.kategori === 'B' && !g.modul) return 'Modülü seçin (İçerik / Görünürlük).';
    if (!g.aciklama) return g.kategori === 'C' ? 'Ne yapılacak? Açıklama zorunlu.' : 'Açıklama zorunlu: iş ne?';
    if (g.kategori === 'A' && !g.kaynak) return 'İşin nereden geldiğini (kaynak) seçin.';
    return null;
  }

  $('kategori').addEventListener('change', kategoriDegisti);
  // Vazgeç: formu temizler ve Kontrol Paneli'ne döner. Formda bilgi varsa
  // yanlışlıkla silinmesin diye ilk tıklamada onay ister.
  var vazgecOnay = null;
  function formDoluMu() {
    if (secili) return true;
    return ['aciklama', 'kapsam', 'notlar', 'termin', 'musteriAra'].some(function (id) { return $(id).value.trim() !== ''; });
  }
  function vazgecSifirla() {
    clearTimeout(vazgecOnay); vazgecOnay = null; $('vazgec').textContent = 'Vazgeç';
  }
  $('vazgec').addEventListener('click', function () {
    if (formDoluMu() && !vazgecOnay) {
      $('vazgec').textContent = 'Girilenler silinsin mi? Tekrar bas';
      vazgecOnay = setTimeout(vazgecSifirla, 4000);
      return;
    }
    vazgecSifirla();
    formuTemizle(); mesajGoster('mesaj', '', '');
    gonder({ tip: 'vazgec' });
  });

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (bekliyor) return;
    var g = girdiTopla();
    var hata = onKontrol(g);
    if (hata) { mesajGoster('mesaj', 'hata', hata); return; }
    bekliyor = true; $('kaydet').disabled = true;
    mesajGoster('mesaj', 'bilgi', 'Kaydediliyor…');
    gonder({ tip: 'kaydet', girdi: g });
  });

  // ---- Sayfa kodundan gelen mesajlar ----

  window.addEventListener('message', function (e) {
    if (e.source !== window.parent) return;
    var d = e.data || {};
    if (d.tip === 'secenekler') {
      var ilk = !secenekGeldi;
      secenekGeldi = true;
      var v = d.veri || {};
      musteriler = v.musteriler || [];
      secenekDoldur($('kategori'), v.kategoriler || {});
      secenekDoldur($('kaynak'), v.kaynaklar || {}, 'Seçin…');
      secenekDoldur($('modul'), v.moduller || {}, 'Seçin…');
      aciliyetDoldur(v.aciliyetler || {});
      kategoriDegisti();
      if (!bekliyor) $('kaydet').disabled = false;
      if (ilk) mesajGoster('mesaj', '', '');
    } else if (d.tip === 'musteriEklendi') {
      musteriBekliyor = false; $('musteriKaydet').disabled = false;
      if (d.basarili && d.musteri) {
        musteriler.push(d.musteri);
        musteriler.sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'tr'); });
        $('perde').hidden = true;
        musteriSec(d.musteri);
      } else {
        mesajGoster('musteriMesaj', 'hata', d.hata || 'Müşteri kaydedilemedi.');
      }
    } else if (d.tip === 'sonuc') {
      bekliyor = false; $('kaydet').disabled = false;
      if (d.basarili) {
        var r = d.veri;
        var metin = r.asama === 'takip'
          ? 'Kaydedildi: ' + r.isId + '\nYapılacaklar listesinde.'
          : 'İş kaydedildi: ' + r.isId + '\nAşama: ' + r.asamaEtiketi + ' / ' + r.durumEtiketi;
        if (r.uyarilar && r.uyarilar.length) {
          mesajGoster('mesaj', 'uyari', metin + '\n\nDikkat: ' + r.uyarilar.join('\n'));
        } else {
          mesajGoster('mesaj', 'tamam', metin);
        }
        formuTemizle();
      } else {
        mesajGoster('mesaj', 'hata', d.hata || 'Kaydedilemedi.');
      }
    } else if (d.tip === 'yuklemeHatasi') {
      secenekGeldi = true;
      mesajGoster('mesaj', 'hata', d.hata || 'Form yüklenemedi.');
    }
  });

  // Sayfa kodu hazır olana kadar "hazir" mesajını tekrarla (sayfa kodu
  // formdan sonra yüklenebilir). 10 sn içinde cevap yoksa sorunu göster.
  var deneme = 0;
  mesajGoster('mesaj', 'bilgi', 'Form yükleniyor…');
  var zamanlayici = setInterval(function () {
    if (secenekGeldi) { clearInterval(zamanlayici); return; }
    deneme++;
    gonder({ tip: 'hazir' });
    if (deneme === 10) {
      mesajGoster('mesaj', 'hata', 'Form sayfa koduna bağlanamadı. Sayfayı yenileyin. Sorun sürerse: Editor\'de bu HTML öğesinin ID\'si "isGirisiFormu" olmalı ve site Publish edilmiş olmalı.');
    }
  }, 1000);
  gonder({ tip: 'hazir' });
})();
</script>
</body>
</html>
